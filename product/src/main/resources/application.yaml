spring:
  application:
    name: product
  http:
    clients:
      connect-timeout: 2s
      read-timout: 3s
  datasource:
    url: jdbc:h2:mem:product_db
    driver-class-name: org.h2.Driver
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8900

inventory:
  base-url: http://localhost:8901
