info:
  name: Créer un produit
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/products"
  body:
    type: json
    data: |-
      {
        "id": null,
        "name": "product",
        "category": "category",
        "description": "description"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
